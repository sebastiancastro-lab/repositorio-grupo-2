<<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Monitoreo de Signos Vitales</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th {
            background-color: #f1f5f9; color: #334155; font-weight: 700; text-transform: uppercase;
            font-size: 0.75rem; letter-spacing: 0.05em; padding: 12px 16px;
            border: 1px solid #cbd5e1; text-align: left;
        }
        td { padding: 12px 16px; border: 1px solid #e2e8f0; vertical-align: middle; }
        tr:nth-child(even) { background-color: #f8fafc; }
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(15, 23, 42, 0.65); backdrop-filter: blur(4px);
            z-index: 50; align-items: center; justify-content: center;
        }
    </style>
</head>
<body class="bg-slate-100 font-sans text-slate-800">

    <header class="bg-teal-700 text-white p-4 shadow-lg border-b border-teal-800">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">🏥 Sistema de Monitoreo de Signos Vitales</h1>
            <span id="api-status" class="text-xs bg-teal-800 border border-teal-600 px-3 py-1 rounded-full text-teal-100 font-medium">
                ⏳ Conectando...
            </span>
        </div>
    </header>

    <div class="container mx-auto p-6">
        <div class="flex border-b border-slate-300 mb-6 bg-white rounded-t-xl shadow-sm overflow-hidden">
            <button onclick="switchTab('pacientes')" id="tab-pacientes" class="px-6 py-3.5 font-semibold text-teal-700 border-b-2 border-teal-700 bg-teal-50/50 transition-all">Pacientes</button>
            <button onclick="switchTab('tipos-signo')" id="tab-tipos-signo" class="px-6 py-3.5 font-semibold text-slate-500 hover:text-teal-700 transition-all">Tipos de Signo</button>
            <button onclick="switchTab('dispositivos')" id="tab-dispositivos" class="px-6 py-3.5 font-semibold text-slate-500 hover:text-teal-700 transition-all">Dispositivos</button>
            <button onclick="switchTab('registros')" id="tab-registros" class="px-6 py-3.5 font-semibold text-slate-500 hover:text-teal-700 transition-all">Registros de Signos</button>
        </div>

        <div class="bg-white p-6 rounded-b-xl shadow-sm border border-slate-200">
            <div class="flex justify-between items-center mb-6">
                <div>
                    <h2 id="section-title" class="text-xl font-bold text-slate-800 uppercase tracking-wide">Listado de Pacientes</h2>
                    <p class="text-xs text-slate-500 mt-1">Gestión centralizada de información en tiempo real</p>
                </div>
                <button onclick="openModal()" class="bg-teal-600 hover:bg-teal-700 text-white px-5 py-2.5 rounded-lg font-medium text-sm flex items-center gap-2 shadow-sm transition-all">
                    <span>+</span> Nuevo Registro
                </button>
            </div>

            <div class="overflow-x-auto rounded-lg border border-slate-300 shadow-sm">
                <table class="w-full text-left border-collapse">
                    <thead><tr id="table-head"></tr></thead>
                    <tbody id="table-body" class="text-sm"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="modal" style="display: none;" class="modal-overlay p-4">
        <div class="bg-white rounded-xl p-6 max-w-lg w-full shadow-2xl border border-slate-100">
            <div class="flex justify-between items-center mb-5 pb-3 border-b border-slate-100">
                <h3 id="modal-title" class="text-lg font-bold text-slate-800">Formulario</h3>
                <button type="button" onclick="closeModal()" class="text-slate-400 hover:text-slate-600 font-bold text-xl">&times;</button>
            </div>

            <form id="dynamic-form" onsubmit="handleSubmit(event)" class="space-y-4">
                <div id="form-fields" class="space-y-4 max-h-[60vh] overflow-y-auto pr-1"></div>
                <div class="flex justify-end gap-3 pt-4 border-t border-slate-100 mt-6">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 border border-slate-300 rounded-lg text-slate-600 text-sm font-medium hover:bg-slate-50 transition-all">Cancelar</button>
                    <button type="submit" id="btn-save" class="px-5 py-2 bg-teal-600 hover:bg-teal-700 text-white rounded-lg text-sm font-semibold shadow-sm transition-all flex items-center gap-2">
                        <span>Guardar Datos</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_URL = "http://127.0.0.1:8000/api";
        let currentTab = "pacientes";
        let editId = null;

        // Estados de dispositivo: deben coincidir con Dispositivo.ESTADOS del backend.
        const ESTADOS_DISPOSITIVO = [
            { value: 'activo', label: 'Activo' },
            { value: 'en mantenimiento', label: 'En mantenimiento' },
            { value: 'fuera de servicio', label: 'Fuera de servicio' }
        ];

        const schemas = {
            'pacientes': {
                title: 'Listado de Pacientes',
                cols: ['ID', 'Documento', 'Nombres', 'Apellidos', 'Edad', 'Género', 'EPS', 'Acciones'],
                fields: [
                    { name: 'documento', label: 'Número de Documento', type: 'number_only', required: true },
                    { name: 'nombres', label: 'Nombres', type: 'letters_only', required: true },
                    { name: 'apellidos', label: 'Apellidos', type: 'letters_only', required: true },
                    { name: 'edad', label: 'Edad (años)', type: 'number_only', required: true },
                    { name: 'genero', label: 'Género', type: 'select_static', options: ['Masculino', 'Femenino', 'Otro'], required: true },
                    { name: 'eps', label: 'EPS', type: 'text', required: true }
                ]
            },
            'tipos-signo': {
                title: 'Listado de Tipos de Signo',
                cols: ['ID', 'Nombre de Signo', 'Unidad de Medida', 'Mínimo Normal', 'Máximo Normal', 'Acciones'],
                fields: [
                    { name: 'nombre', label: 'Nombre del Signo Vital', type: 'letters_only', required: true },
                    { name: 'unidad_medida', label: 'Unidad de Medida (ej. mmHg, °C, lpm)', type: 'text', required: true },
                    { name: 'valor_min_normal', label: 'Valor Mínimo Normal', type: 'decimal', required: true },
                    { name: 'valor_max_normal', label: 'Valor Máximo Normal', type: 'decimal', required: true }
                ]
            },
            'dispositivos': {
                title: 'Listado de Dispositivos',
                cols: ['ID', 'Nombre Dispositivo', 'Marca', 'Modelo', 'N° Serie', 'Estado', 'Acciones'],
                fields: [
                    { name: 'nombre', label: 'Nombre del Dispositivo', type: 'text', required: true },
                    { name: 'marca', label: 'Marca', type: 'text', required: true },
                    { name: 'modelo', label: 'Modelo', type: 'text', required: true },
                    { name: 'numero_serie', label: 'Número de Serie', type: 'text', required: true },
                    { name: 'estado', label: 'Estado', type: 'select_static', options: ESTADOS_DISPOSITIVO, required: true }
                ]
            },
            'registros': {
                title: 'Listado de Registros de Signos',
                cols: ['ID', 'Paciente', 'Tipo Signo', 'Dispositivo', 'Valor Medido', 'Rango de Referencia', 'Estado', 'Fecha y Hora', 'Responsable', 'Acciones'],
                fields: [
                    { name: 'paciente', label: 'Seleccionar Paciente Existente', type: 'select_api', endpoint: 'pacientes', displayKey: (item) => `${item.nombres} ${item.apellidos} - Doc: ${item.documento}`, required: true },
                    { name: 'tipo_signo', label: 'Seleccionar Signo Vital', type: 'select_api', endpoint: 'tipos-signo', displayKey: (item) => `${item.nombre} (${item.unidad_medida})`, required: true },
                    // Solo dispositivos activos (o el ya asignado al editar un registro antiguo)
                    { name: 'dispositivo', label: 'Seleccionar Dispositivo (solo activos)', type: 'select_api', endpoint: 'dispositivos', onlyActive: true, displayKey: (item) => `${item.nombre} [${item.marca} - ${item.numero_serie}]`, required: true },
                    { name: 'valor_medido', label: 'Valor Medido', type: 'decimal', required: true },
                    { name: 'responsable', label: 'Responsable (quien toma la medición)', type: 'text', required: true }
                ]
            }
        };

        function switchTab(tab) {
            closeModal();
            currentTab = tab;
            document.querySelectorAll('[id^="tab-"]').forEach(btn => {
                btn.className = "px-6 py-3.5 font-semibold text-slate-500 hover:text-teal-700 transition-all";
            });
            const activeBtn = document.getElementById(`tab-${tab}`);
            if (activeBtn) {
                activeBtn.className = "px-6 py-3.5 font-semibold text-teal-700 border-b-2 border-teal-700 bg-teal-50/50 transition-all";
            }
            document.getElementById('section-title').innerText = schemas[tab].title;
            loadData();
        }

        function setApiStatus(ok) {
            const el = document.getElementById('api-status');
            el.innerText = ok ? '🟢 API Conectada' : '🔴 API sin conexión';
        }

        function escapeHtml(v) {
            return String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        // Convierte {campo: ["mensaje"]} de DRF en texto legible
        function formatErrors(data) {
            if (typeof data === 'string') return data;
            if (data.detail) return data.detail;
            return Object.entries(data).map(([campo, msgs]) => {
                const texto = Array.isArray(msgs) ? msgs.join(' ') : String(msgs);
                return campo === 'non_field_errors' ? texto : `${campo}: ${texto}`;
            }).join('\n');
        }

        async function loadData() {
            const tbody = document.getElementById('table-body');
            try {
                const res = await fetch(`${API_URL}/${currentTab}/`);
                if (!res.ok) throw new Error("Error al obtener datos");
                const data = await res.json();
                setApiStatus(true);

                document.getElementById('table-head').innerHTML = schemas[currentTab].cols.map(c =>
                    `<th class="border border-slate-300 p-3.5 font-bold text-slate-700 uppercase bg-slate-100 text-xs">${c}</th>`).join('');

                if (!Array.isArray(data) || data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="${schemas[currentTab].cols.length}" class="p-8 text-center text-slate-400 italic">No existen registros guardados.</td></tr>`;
                    return;
                }

                tbody.innerHTML = data.map(item => `
                    <tr class="hover:bg-slate-50 transition-colors">
                        <td class="p-3.5 font-mono text-xs text-slate-500 font-bold border border-slate-200">#${item.id}</td>
                        ${renderRowCells(item)}
                        <td class="p-3.5 border border-slate-200">
                            <div class="flex gap-2">
                                <button onclick="openModal(${item.id})" class="px-3 py-1 bg-amber-500 hover:bg-amber-600 text-white rounded-md text-xs font-medium shadow-sm transition-all">Editar</button>
                                <button onclick="deleteItem(${item.id})" class="px-3 py-1 bg-rose-600 hover:bg-rose-700 text-white rounded-md text-xs font-medium shadow-sm transition-all">Eliminar</button>
                            </div>
                        </td>
                    </tr>
                `).join('');
            } catch (err) {
                console.error("Error al cargar datos:", err);
                setApiStatus(false);
                tbody.innerHTML = `<tr><td colspan="${schemas[currentTab].cols.length}" class="p-8 text-center text-rose-500">No se pudo conectar con la API. Verifica que el servidor Django esté activo.</td></tr>`;
            }
        }

        function badgeEstadoDispositivo(estado) {
            const colores = {
                'activo': 'bg-emerald-100 text-emerald-800 border-emerald-300',
                'en mantenimiento': 'bg-amber-100 text-amber-800 border-amber-300',
                'fuera de servicio': 'bg-rose-100 text-rose-800 border-rose-300'
            };
            const cls = colores[estado] || 'bg-slate-100 text-slate-700 border-slate-300';
            return `<span class="${cls} font-medium px-2 py-0.5 rounded text-xs border">${escapeHtml(estado)}</span>`;
        }

        function badgeEstadoValor(estado) {
            const map = {
                'normal': ['bg-emerald-100 text-emerald-800 border-emerald-300', '🟢 Normal'],
                'bajo':   ['bg-amber-100 text-amber-800 border-amber-300', '🟡 Bajo'],
                'alto':   ['bg-rose-100 text-rose-800 border-rose-300', '🔴 Alto']
            };
            const m = map[estado];
            if (!m) return '<span class="bg-slate-100 text-slate-500 font-medium text-xs px-2 py-1 rounded">Sin Ref.</span>';
            return `<span class="${m[0]} border font-bold text-xs px-2.5 py-1 rounded-full inline-flex items-center gap-1">${m[1]}</span>`;
        }

        function renderRowCells(item) {
            if (currentTab === 'pacientes') {
                return `
                    <td class="p-3.5 font-mono text-xs text-slate-700 border border-slate-200">${escapeHtml(item.documento)}</td>
                    <td class="p-3.5 font-semibold text-slate-800 border border-slate-200">${escapeHtml(item.nombres)}</td>
                    <td class="p-3.5 text-slate-700 border border-slate-200">${escapeHtml(item.apellidos)}</td>
                    <td class="p-3.5 text-slate-600 border border-slate-200">${item.edad} años</td>
                    <td class="p-3.5 text-slate-600 border border-slate-200">${escapeHtml(item.genero)}</td>
                    <td class="p-3.5 border border-slate-200"><span class="bg-teal-50 text-teal-700 font-medium px-2 py-1 rounded border border-teal-200 text-xs">${escapeHtml(item.eps)}</span></td>`;
            } else if (currentTab === 'tipos-signo') {
                return `
                    <td class="p-3.5 font-semibold text-slate-800 border border-slate-200">${escapeHtml(item.nombre)}</td>
                    <td class="p-3.5 font-mono text-xs text-teal-700 font-bold border border-slate-200 bg-teal-50/30">${escapeHtml(item.unidad_medida)}</td>
                    <td class="p-3.5 text-slate-700 font-medium border border-slate-200 text-center">${item.valor_min_normal}</td>
                    <td class="p-3.5 text-slate-700 font-medium border border-slate-200 text-center">${item.valor_max_normal}</td>`;
            } else if (currentTab === 'dispositivos') {
                return `
                    <td class="p-3.5 font-semibold text-slate-800 border border-slate-200">${escapeHtml(item.nombre)}</td>
                    <td class="p-3.5 text-slate-600 border border-slate-200">${escapeHtml(item.marca)}</td>
                    <td class="p-3.5 text-slate-600 border border-slate-200">${escapeHtml(item.modelo)}</td>
                    <td class="p-3.5 font-mono text-xs text-slate-500 border border-slate-200">${escapeHtml(item.numero_serie)}</td>
                    <td class="p-3.5 border border-slate-200">${badgeEstadoDispositivo(item.estado)}</td>`;
            } else if (currentTab === 'registros') {
                // La API devuelve el detalle anidado de cada relación
                const p = item.paciente_detalle, t = item.tipo_signo_detalle, d = item.dispositivo_detalle;
                const pac = p ? `${p.nombres} ${p.apellidos}` : `Paciente #${item.paciente}`;
                const tipoNombre = t ? t.nombre : `Signo #${item.tipo_signo}`;
                const disp = d ? d.nombre : `Dispositivo #${item.dispositivo}`;
                const unidad = t ? t.unidad_medida : '';
                const rangoStr = t ? `${t.valor_min_normal} - ${t.valor_max_normal} ${unidad}` : 'N/A';
                const fecha = item.fecha_hora ? new Date(item.fecha_hora).toLocaleString() : 'N/A';

                return `
                    <td class="p-3.5 font-semibold text-slate-800 border border-slate-200">${escapeHtml(pac)}</td>
                    <td class="p-3.5 text-slate-700 border border-slate-200">${escapeHtml(tipoNombre)}</td>
                    <td class="p-3.5 text-slate-600 border border-slate-200">${escapeHtml(disp)}</td>
                    <td class="p-3.5 font-bold text-teal-800 text-base border border-slate-200 bg-teal-50/30">${item.valor_medido} <span class="text-xs font-normal text-teal-600">${escapeHtml(unidad)}</span></td>
                    <td class="p-3.5 font-mono text-xs text-slate-600 border border-slate-200">${escapeHtml(rangoStr)}</td>
                    <td class="p-3.5 border border-slate-200">${badgeEstadoValor(item.estado_valor)}</td>
                    <td class="p-3.5 text-xs text-slate-500 font-mono border border-slate-200">${fecha}</td>
                    <td class="p-3.5 text-slate-600 border border-slate-200">${escapeHtml(item.responsable)}</td>`;
            }
        }

        function optValue(o) { return typeof o === 'string' ? o : o.value; }
        function optLabel(o) { return typeof o === 'string' ? o : o.label; }

        async function openModal(id = null) {
            editId = id;
            const nombreSeccion = schemas[currentTab].title.replace('Listado de ', '');
            document.getElementById('modal-title').innerText = id ? `Editar: ${nombreSeccion}` : `Nuevo: ${nombreSeccion}`;
            const fieldsContainer = document.getElementById('form-fields');
            fieldsContainer.innerHTML = `<p class="text-xs text-slate-400 italic p-2">Cargando opciones...</p>`;
            document.getElementById('modal').style.display = 'flex';

            let itemData = {};
            try {
                if (id) {
                    const res = await fetch(`${API_URL}/${currentTab}/${id}/`);
                    itemData = await res.json();
                }

                let fieldsHTML = '';
                for (const f of schemas[currentTab].fields) {
                    const raw = itemData[f.name] !== undefined ? itemData[f.name] : '';
                    const val = escapeHtml(raw);
                    const req = f.required ? 'required' : '';
                    const label = `<label class="block text-xs font-bold uppercase text-slate-600 mb-1">${f.label}</label>`;
                    const inputCls = "w-full border border-slate-300 p-2.5 rounded-lg text-sm focus:ring-2 focus:ring-teal-500 outline-none";

                    if (f.type === 'letters_only') {
                        fieldsHTML += `<div>${label}<input type="text" id="field-${f.name}" value="${val}"
                            oninput="this.value = this.value.replace(/[^a-zA-ZáéíóúÁÉÍÓÚñÑ\\s]/g, '')"
                            placeholder="Solo letras" class="${inputCls}" ${req} /></div>`;
                    } else if (f.type === 'number_only') {
                        fieldsHTML += `<div>${label}<input type="text" id="field-${f.name}" value="${val}"
                            oninput="this.value = this.value.replace(/[^0-9]/g, '')"
                            placeholder="Solo números enteros" class="${inputCls}" ${req} /></div>`;
                    } else if (f.type === 'decimal') {
                        fieldsHTML += `<div>${label}<input type="number" step="any" id="field-${f.name}" value="${val}"
                            placeholder="Ej. 36.5" class="${inputCls}" ${req} /></div>`;
                    } else if (f.type === 'select_static') {
                        const opts = f.options.map(o => `<option value="${escapeHtml(optValue(o))}" ${raw === optValue(o) ? 'selected' : ''}>${escapeHtml(optLabel(o))}</option>`).join('');
                        fieldsHTML += `<div>${label}<select id="field-${f.name}" class="${inputCls} bg-white" ${req}>
                            <option value="" disabled ${!raw ? 'selected' : ''}>-- Seleccione una opción --</option>${opts}</select></div>`;
                    } else if (f.type === 'select_api') {
                        const apiRes = await fetch(`${API_URL}/${f.endpoint}/`);
                        let apiData = await apiRes.json();
                        if (f.onlyActive) {
                            apiData = apiData.filter(item => item.estado === 'activo' || item.id === raw);
                        }
                        const opts = apiData.map(item => `<option value="${item.id}" ${raw === item.id ? 'selected' : ''}>${escapeHtml(f.displayKey(item))}</option>`).join('');
                        const vacio = apiData.length === 0 ? '-- No hay opciones disponibles --' : '-- Seleccione de la lista existente --';
                        fieldsHTML += `<div>${label}<select id="field-${f.name}" class="${inputCls} bg-white" ${req}>
                            <option value="" disabled ${!raw ? 'selected' : ''}>${vacio}</option>${opts}</select></div>`;
                    } else {
                        fieldsHTML += `<div>${label}<input type="text" id="field-${f.name}" value="${val}" class="${inputCls}" ${req} /></div>`;
                    }
                }
                fieldsContainer.innerHTML = fieldsHTML;
            } catch (err) {
                fieldsContainer.innerHTML = `<p class="text-sm text-rose-500 p-2">No se pudo cargar el formulario. Verifica que la API esté activa.</p>`;
            }
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
            document.getElementById('dynamic-form').reset();
            editId = null;
        }

        async function handleSubmit(e) {
            e.preventDefault();
            const btnSave = document.getElementById('btn-save');
            const payload = {};
            let isFormValid = true;

            schemas[currentTab].fields.forEach(f => {
                const el = document.getElementById(`field-${f.name}`);
                const rawVal = el ? el.value.trim() : '';
                if (f.required && !rawVal) isFormValid = false;

                if (f.type === 'select_api') {
                    payload[f.name] = rawVal ? Number(rawVal) : null;
                } else if (f.type === 'number_only') {
                    // El documento se envía como texto (el modelo lo guarda como CharField)
                    payload[f.name] = f.name === 'documento' ? rawVal : (rawVal ? Number(rawVal) : null);
                } else if (f.type === 'decimal') {
                    payload[f.name] = rawVal ? parseFloat(rawVal) : null;
                } else {
                    payload[f.name] = rawVal;
                }
            });

            if (!isFormValid) {
                alert("⚠️ Por favor completa todos los campos obligatorios antes de guardar.");
                return;
            }

            btnSave.disabled = true;
            btnSave.innerText = "Guardando...";

            const url = editId ? `${API_URL}/${currentTab}/${editId}/` : `${API_URL}/${currentTab}/`;
            const method = editId ? 'PUT' : 'POST';

            try {
                const res = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!res.ok) {
                    const errorData = await res.json();
                    alert("⚠️ No se pudo guardar:\n\n" + formatErrors(errorData));
                    return;
                }
                closeModal();
                loadData();
            } catch (err) {
                alert("❌ No se pudo conectar con el servidor Django. Verifica que esté activo.");
            } finally {
                btnSave.disabled = false;
                btnSave.innerText = "Guardar Datos";
            }
        }

        async function deleteItem(id) {
            if (!confirm('¿Estás seguro de que deseas eliminar este registro permanentemente?')) return;
            try {
                const res = await fetch(`${API_URL}/${currentTab}/${id}/`, { method: 'DELETE' });
                if (!res.ok) {
                    const errorData = await res.json().catch(() => ({}));
                    alert("⚠️ " + (formatErrors(errorData) || "No se pudo eliminar el registro."));
                    return;
                }
                loadData();
            } catch (err) {
                alert("❌ No se pudo conectar con el servidor Django. Verifica que esté activo.");
            }
        }

        loadData();
    </script>
</body>
</html>
